<main class="auth-card">

    <div class="join-strip" aria-hidden="true">
        <span>BOARDING PASS</span>
        <span>PASSENGER CHECK-IN</span>
    </div>

    <div class="auth-head">
        <a href="{% url 'index' %}" class="auth-logo">
            {% include "_icon.html" with name="mountain" %} TRIPA
        </a>
        <h1>로그인</h1>
        <p>다시 만나서 반가워요. 여행 계획을 이어가 볼까요?</p>
    </div>

    <form name="f" action="{% url 'login_ok' %}" method="post" onsubmit="return check();" novalidate>
        {% csrf_token %}

        <div class="field">
            <label for="email">이메일(아이디)</label>
            <div class="field-box">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>
                </svg>
                <input type="text" id="email" name="email" placeholder="example@tripa.com" autocomplete="username" autofocus>
            </div>
        </div>

        <div class="field">
            <label for="pwd">비밀번호</label>
            <div class="field-box">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                </svg>
                <input type="password" id="pwd" name="pwd" placeholder="비밀번호" autocomplete="current-password">
                <button type="button" class="pw-toggle" id="pwToggle" aria-label="비밀번호 보기" aria-pressed="false">
                    <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
                    </svg>
                    <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M3 3l18 18"/><path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.6C3.9 8.4 2 12 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
                    </svg>
                </button>
            </div>
        </div>

        <p class="form-error" id="formError" role="alert"></p>

        <button type="submit" class="btn-submit">로그인</button>
    </form>

    <div class="auth-links">
        <p>아직 회원이 아니신가요? <a href="{% url 'join' %}">회원가입</a></p>
        <p>아이디·비밀번호를 잊으셨나요? <a href="{% url 'idpw' %}">ID/PW 찾기</a></p>
        <p class="auth-home">
            <a href="{% url 'index' %}">← 홈으로 가기</a>
        </p>
    </div>

</main>

<script>
    // 입력 검사: 비어 있거나 너무 길면 화면에 안내하고 막음 (길이 기준은 예전과 같음)
    function getByteLen(str) {
        return str.replace(/[\0-\x7f]|([0-߿]|(.))/g, "$&$1$2").length;
    }

    function showError(input, message) {
        document.getElementById('formError').textContent = message;
        input.focus();
        return false;
    }

    function check() {
        var f = document.f;
        var id = f.email.value.trim();
        var pw = f.pwd.value.trim();

        if (id.length === 0) return showError(f.email, '아이디(이메일)를 입력해 주세요.');
        if (getByteLen(id) > 50) return showError(f.email, '아이디가 너무 길어요.');
        if (pw.length === 0) return showError(f.pwd, '비밀번호를 입력해 주세요.');
        if (getByteLen(pw) > 30) return showError(f.pwd, '비밀번호가 너무 길어요.');

        f.email.value = id;
        return true;
    }

    // 입력을 다시 시작하면 안내 문구 지우기
    document.f.addEventListener('input', function () {
        document.getElementById('formError').textContent = '';
    });

    // 탑승권 양옆 홈을 아래 점선(링크 영역 윗선) 높이에 맞춤
    function placeNotch() {
        var card = document.querySelector('.auth-card');
        var links = document.querySelector('.auth-links');
        card.style.setProperty('--cut', links.offsetTop + 'px');
    }
    placeNotch();
    window.addEventListener('resize', placeNotch);
    // 안내 문구가 생기거나 탭이 바뀌어 카드 높이가 달라지면 다시 맞춤
    document.addEventListener('input', placeNotch);
    if (window.ResizeObserver) new ResizeObserver(placeNotch).observe(document.querySelector('.auth-card'));
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(placeNotch);

    // 비밀번호 보기 / 숨기기
    document.getElementById('pwToggle').addEventListener('click', function () {
        var pw = document.getElementById('pwd');
        var show = pw.type === 'password';
        pw.type = show ? 'text' : 'password';
        pw.classList.toggle('is-shown', show);
        this.classList.toggle('is-on', show);
        this.setAttribute('aria-pressed', show ? 'true' : 'false');
        this.setAttribute('aria-label', show ? '비밀번호 숨기기' : '비밀번호 보기');
        pw.focus();
    });
</script>
